server {
    listen 80;
    server_name 10.111.21.91;
    client_max_body_size 100M;

    # Shared proxy settings, inherited by every location below
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # ---------------- API backends (trailing / on proxy_pass strips the prefix) ----------------
    # proxy_redirect re-adds the stripped prefix to backend redirects (e.g. FastAPI's
    # /x -> /x/ slash redirect), otherwise they escape to the default location.
    location = /api/precog { return 307 /api/precog/; }
    location /api/precog/ {
        proxy_pass http://precog-engine:5000/;
        proxy_redirect ~^(?:https?://[^/]+)?/(.*)$ /api/precog/$1;
    }

    location = /api/agent { return 307 /api/agent/; }
    location /api/agent/ {
        proxy_pass http://api-agent:8010/;
        proxy_redirect ~^(?:https?://[^/]+)?/(.*)$ /api/agent/$1;
    }

    location = /api/pi { return 307 /api/pi/; }
    location /api/pi/ {
        proxy_pass http://fabrix-backend:8000/;
        proxy_redirect ~^(?:https?://[^/]+)?/(.*)$ /api/pi/$1;
    }

    location = /api/connections { return 307 /api/connections/; }
    location /api/connections/ {
        proxy_pass http://api-connections:8010/;
        proxy_redirect ~^(?:https?://[^/]+)?/(.*)$ /api/connections/$1;
    }

    # ---------------- Frontends (prefix is kept, as before) ----------------
    location = /hektorprecogs { return 307 /hektorprecogs/; }
    location /hektorprecogs/ {
        proxy_pass http://precog-frontend:8080;
    }

    location = /connections { return 307 /connections/; }
    location /connections/ {
        proxy_pass http://app-connections:8080;
    }

    location = /esper-agent { return 307 /esper-agent/; }
    location /esper-agent/ {
        proxy_pass http://app-esper-agent:8080;
    }

    # Default: main UI
    location / {
        proxy_pass http://pi-frontend:8080;
    }
}
