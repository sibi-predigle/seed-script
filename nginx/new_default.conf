map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

log_format pidesign_upstream '$remote_addr [$time_local] "$request" $status '
                             'upstream=$upstream_addr ustatus=$upstream_status rt=$request_time';

server {
    listen 80;
    server_name 10.111.21.91;
    client_max_body_size 100M;

    # Re-resolve container names (Docker embedded DNS)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    access_log /var/log/nginx/access.log pidesign_upstream;

    # Shared proxy settings, inherited by every location below
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;

    # ---------------- API backends (prefix is stripped) ----------------
    location = /api/precog { return 307 /api/precog/; }
    location /api/precog/ {
        set $up http://precog-engine:5000;
        rewrite ^/api/precog/(.*)$ /$1 break;
        proxy_pass $up;
    }

    location = /api/agent { return 307 /api/agent/; }
    location /api/agent/ {
        set $up http://api-agent:8010;
        rewrite ^/api/agent/(.*)$ /$1 break;
        proxy_pass $up;
    }

    location = /api/pi { return 307 /api/pi/; }
    location /api/pi/ {
        set $up http://fabrix-backend:8000;
        rewrite ^/api/pi/(.*)$ /$1 break;
        proxy_pass $up;
    }

    location = /api/connections { return 307 /api/connections/; }
    location /api/connections/ {
        set $up http://api-connections:8010;
        rewrite ^/api/connections/(.*)$ /$1 break;
        proxy_pass $up;
    }

    # Unknown /api/* paths: clear JSON 404 instead of falling through to the UI
    location ^~ /api/ {
        default_type application/json;
        return 404 '{"error":"unknown api route"}';
    }

    # ---------------- Frontends (prefix is kept, as before) ----------------
    location = /hektorprecogs { return 307 /hektorprecogs/; }
    location /hektorprecogs/ {
        set $up http://precog-frontend:8080;
        proxy_pass $up;
    }

    location = /connections { return 307 /connections/; }
    location /connections/ {
        set $up http://app-connections:8080;
        proxy_pass $up;
    }

    location = /esper-agent { return 307 /esper-agent/; }
    location /esper-agent/ {
        set $up http://app-esper-agent:8080;
        proxy_pass $up;
    }

    # Default: main UI
    location / {
        set $up http://pi-frontend:8080;
        proxy_pass $up;
    }
}
